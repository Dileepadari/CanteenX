name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: canteenx
          POSTGRES_PASSWORD: canteenx
          POSTGRES_DB: canteenx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U canteenx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://canteenx:canteenx@localhost:5432/canteenx_test
      JWT_SECRET: ci-secret-that-is-at-least-32-characters-long
      ENVIRONMENT: test
      CORS_ORIGINS: http://localhost:8080

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app scripts tests

      - name: Format check
        run: ruff format --check app scripts tests

      - name: Types
        run: mypy app --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      - name: Migrations build the schema from empty
        run: alembic upgrade head

      - name: No model/migration drift
        # Catches a model edited without a migration - the exact drift that
        # let the previous schema diverge from its migration history.
        run: alembic check

      - name: Tests
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        # Runs against the committed generated types; regenerate with
        # `npm run codegen` when the schema changes.
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build
        run: npx vite build
