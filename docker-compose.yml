services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: canteenx
      POSTGRES_PASSWORD: canteenx
      POSTGRES_DB: canteenx
    ports: ["55432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canteenx -d canteenx"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    # Migrations run as a release step, then the server starts. The app never
    # creates tables itself - Alembic is the only source of schema truth.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql://canteenx:canteenx@db:5432/canteenx
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-at-least-32-characters-long}
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:8080
      SEED_PASSWORD: ${SEED_PASSWORD:-canteenx-dev-2026}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      ORACLE_UPLOAD_BASE_URL: ${ORACLE_UPLOAD_BASE_URL:-}
      ORACLE_PUBLIC_BASE_URL: ${ORACLE_PUBLIC_BASE_URL:-}
      ORACLE_UPLOAD_API_KEY: ${ORACLE_UPLOAD_API_KEY:-}
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_DEV_API_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports: ["8080:8080"]
    depends_on: [api]

volumes:
  postgres_data:
