[pytest]
testpaths = tests
asyncio_mode = auto
# The async engine binds to the loop that created it, so fixtures *and*
# tests must share one loop or asyncpg raises "attached to a different loop".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning:pkg_resources
    ignore::DeprecationWarning:razorpay
